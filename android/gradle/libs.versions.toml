[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
hilt = "2.60.1"
# androidx.hilt 1.4 is the first release built against navigation 2.9 and
# lifecycle 2.9. 1.2.0 (March 2024) was the one library left behind by the
# 2.0.2 toolchain jump, and hiltViewModel() runs at the very first
# composition — which is exactly where 2.0.2 dies.
hiltNavigationCompose = "1.4.0"
composeBom = "2026.06.01"
# 1.11+ is the first release whose enableEdgeToEdge() stops calling the
# setStatusBarColor / setNavigationBarColor / SHORT_EDGES APIs deprecated in
# Android 15. It requires compileSdk 36, which is why this moved with AGP.
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycleKtx = "2.11.0"
navigationCompose = "2.9.8"
workManager = "2.11.2"
# 1.2.0-alpha05 is February 2022 — the one androidx artifact the 2.0.2
# toolchain jump left behind, next to libraries that all moved to 2026
# releases. It also pinned androidx.fragment to 1.2.5 while everything around
# it wanted far newer. 1.4.0-alpha07 is the newest published release (there is
# no stable line past 1.1.0) and depends on fragment 1.6.2.
biometric = "1.4.0-alpha07"
datastore = "1.2.1"
# 5.17.0+ ships 16 KB page-aligned libjnidispatch.so (Android 15 requirement)
jna = "5.19.1"
reorderable = "3.1.0"
# Compose-native markdown. Image loading is a SEPARATE module (-coil3), so we
# render images ourselves from decrypted bytes and pull in no network stack.
markdown = "0.43.0"
appcompat = "1.7.1"
pdfboxAndroid = "2.0.27.0"
# 4.8.0+ ships 16 KB page-aligned native libs (libtesseract, libleptonica, …)
tesseract4android = "4.9.0"
exifinterface = "1.4.2"
junit = "4.13.2"
# Test-only: runTest + StandardTestDispatcher, so a ViewModel's viewModelScope
# is drained deterministically instead of racing the assertions.
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-hilt = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-android", version.ref = "markdown" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdown" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
tesseract4android = { group = "com.github.adaptech-cz.Tesseract4Android", name = "tesseract4android", version.ref = "tesseract4android" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
