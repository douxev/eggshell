# ── Build speed, measured 2026-08-08 on this repo ────────────────────────────
# Profiled with --profile. Configuration is 0.4s, so the configuration cache
# would buy nothing and is left off. cargoBuildRust is cached between builds, so
# -PdevAbi only pays off on a clean build, not on iteration.
#
# Two tasks are 90% of a release build: minifyReleaseWithR8 (2m09 cold) and
# lintVitalAnalyzeRelease (54s). Both are release-only.
#
#   ./gradlew assembleDebug                          ~11s incremental  ← iterate here
#   ./gradlew :app:compileReleaseKotlin              ~4s   type-check only
#   ./gradlew assembleRelease -PskipLintVital        ~57s  incremental
#   ./gradlew assembleRelease                        ~97s  incremental, 2m24 cold
#
# Build a release APK when you need a release APK — signed, shrunk, R8'd. Do not
# build one to see whether a screen compiles.
#
# -PskipLintVital is local-only. CI runs assembleRelease and nothing else, so
# lintVital there is the only lint gate in the pipeline.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: our cargo-ndk + uniffi-bindgen Exec tasks reference Provider<Directory>
# objects which the config cache can't serialise. Re-enable once we switch to a
# typed task that exposes outputs via @OutputDirectory.
org.gradle.configuration-cache=false
# Pin Gradle to JDK 21 — the default `java` on this machine is JDK 25 (early
# access) which AGP 8.7 / Gradle 8.11 do not support.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Set this in local.properties or env, NOT here :
# rust.cargoCommand=/path/to/your/.cargo/bin/cargo
# rust.targets=arm64-v8a,armeabi-v7a,x86_64,x86

# R8 full mode: the AGP default today, stated explicitly so a future default
# flip cannot silently drop us back to compatibility mode.
android.enableR8.fullMode=true
