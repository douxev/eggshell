name: Android release (APK)

# Builds the signed universal APK and attaches it to a GitHub Release.
# Trigger by pushing a tag like `android-v1.0.0`, or manually (manual runs
# upload a workflow artifact instead of creating a Release). The Play AAB
# is deliberately NOT built or published here — it is produced locally and
# only ever uploaded to the Play Console.
#
# Required secrets:
#   ANDROID_KEYSTORE_B64         base64 of the upload keystore (.jks)
#   EGGSHELL_KEYSTORE_PASSWORD   store password
#   EGGSHELL_KEY_ALIAS           key alias
#   EGGSHELL_KEY_PASSWORD        key password
# The three EGGSHELL_* names are read directly by app/build.gradle.kts.

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle (downloaded dependencies) AND the Gradle build cache
      # across runs. Without it every run re-resolved the whole AndroidX +
      # Compose graph from scratch and started from a cold build cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false
          # setup-gradle defaults to read-only on anything that is not the
          # default branch. This workflow ONLY ever runs from a tag or a manual
          # dispatch, so with the default it would read a cache that nothing is
          # ever allowed to write — permanently cold. Opt in explicitly.
          cache-read-only: false

      # $ANDROID_HOME is a runner *shell* variable, not a workflow one: the
      # `env` context only holds what a workflow/job/step `env:` block put
      # there. `${{ env.ANDROID_HOME }}` therefore expands to the empty string
      # inside `with:`, which silently turned the cache path into an absolute
      # /ndk/... that does not exist — the step went green and cached nothing.
      # Promote it to the env context first so the expansion has something to
      # resolve.
      - name: Resolve NDK path
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-27.2.12479018

      - name: Install pinned Android NDK
        # Must match ndkVersion in app/build.gradle.kts — AGP's strip tooling
        # and cargo-ndk have to agree on the toolchain.
        run: |
          if [ "${{ steps.cache-ndk.outputs.cache-hit }}" != "true" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust toolchain + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          # No x86_64-linux-android: this APK is the sideload/GitHub-Release
          # artifact, which only ever runs on real phones. x86_64 is for
          # emulators and ChromeOS, and it is the locally-built Play AAB that
          # still carries it. Dropping it here removes a third of the Rust
          # work — rusqlite vendors OpenSSL + SQLCipher once per target.
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # `cargo install` compiles cargo-ndk from source, which cost 1-3 minutes
      # on every single run — Swatinem/rust-cache only covers the `core`
      # workspace, not ~/.cargo/bin. Pinned so the cache key is meaningful and
      # so a new upstream release cannot change the build under us.
      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-4.1.2

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Materialize signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        # keystores/ is fully gitignored, so it does not exist in a fresh
        # checkout — recreate it before decoding.
        run: |
          mkdir -p keystores
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > keystores/eggshell-upload.jks

      - name: Build signed release APK
        env:
          EGGSHELL_KEYSTORE: keystores/eggshell-upload.jks
          EGGSHELL_KEYSTORE_PASSWORD: ${{ secrets.EGGSHELL_KEYSTORE_PASSWORD }}
          EGGSHELL_KEY_ALIAS: ${{ secrets.EGGSHELL_KEY_ALIAS }}
          EGGSHELL_KEY_PASSWORD: ${{ secrets.EGGSHELL_KEY_PASSWORD }}
        # -Dorg.gradle.java.home overrides the machine-specific JDK pin in
        # android/gradle.properties (a local path that doesn't exist on the
        # runner); setup-java's JAVA_HOME is the right JDK here.
        run: |
          cd android
          # No --no-daemon: setup-gradle manages the daemon and needs it alive
          # to write the build cache in its post step. It stops it at job end.
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" \
            -PdevAbi=arm64-v8a,armeabi-v7a assembleRelease

      - name: Version-stamp artifact
        id: meta
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          VC=$(grep -oP 'versionCode = \K\d+' android/app/build.gradle.kts)
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "eggshell-$VN-$VC.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The product name is always lowercase, releases included.
          name: eggshell ${{ steps.meta.outputs.version }} (Android)
          generate_release_notes: true
          files: eggshell-*.apk

      # NB: GitHub always zips upload-artifact downloads. That is platform
      # behaviour, not a setting — the only way to hand out a bare .apk is a
      # Release asset, and on a public repo that means test builds sitting next
      # to the real ones. Kept as an artifact deliberately.
      - name: Upload workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: eggshell-android
          path: eggshell-*.apk
